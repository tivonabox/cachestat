[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tivonabox-cachestat"
version = "0.1.0"
description = "统计命中、过期、淘汰、占用四类状态占比与淘汰速度"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "tivonabox" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://tivonabox.github.io"
Repository = "https://github.com/tivonabox/cachestat"
Issues = "https://github.com/tivonabox/cachestat/issues"

[project.scripts]
cachestat = "cachestat:main"

[tool.setuptools]
py-modules = ["cachestat"]
